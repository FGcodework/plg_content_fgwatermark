<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081D32"/>
      <stop offset="100%" stop-color="#113758"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="95" ry="95"/>
    </clipPath>
    <clipPath id="photoClip">
      <rect x="138" y="168" width="236" height="172" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

    <!-- photo card -->
    <rect x="138" y="168" width="236" height="172" rx="16" ry="16" fill="#F4F7FA"/>

    <g clip-path="url(#photoClip)">
      <circle cx="306" cy="196" r="19" fill="#FFC94A"/>
      <polygon points="138,340 224,266 270,310 326,224 374,340" fill="#0E2C48"/>
      <polygon points="138,340 196,264 234,298 374,340" fill="#164569"/>
    </g>

    <rect x="138" y="168" width="236" height="172" rx="16" ry="16" fill="none" stroke="#0B2338" stroke-width="4"/>

    <!-- stamp badge, slightly rotated -->
    <g transform="rotate(-12 356 330)">
      <circle cx="356" cy="330" r="82" fill="#FF6B4A" stroke="#FFFFFF" stroke-width="6"/>
      <text x="356" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold"
            font-size="74" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">W</text>
    </g>
  </g>
</svg>
